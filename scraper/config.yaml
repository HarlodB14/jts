# Indeed en Glassdoor (NL) via JobSpy, zonder key. Elke run, per zoekterm max results_per_query per site.
jobspy:
  sites: [indeed, glassdoor]
  results_per_query: 50
  queries:
    - junior developer
    - junior software engineer
    - junior software developer
    - junior consultant IT
    - junior .net developer
    - junior php developer
    - junior python developer
    - junior data engineer
    - junior data analist
    - junior cloud engineer
    - junior devops engineer
    - junior AI engineer
    - junior system engineer
    - junior servicedesk
    - junior tester
    - traineeship IT
    - trainee developer
    - starter IT
    - developer
    - software engineer
    - IT consultant
    - systeembeheerder
    - functioneel beheerder
    - business analyst IT
    - data analist
    - hbo ICT starter
    - afgestudeerd informatica

# LinkedIn via Apify (secret APIFY_TOKEN). Gratis plan = $5 per maand tegoed.
linkedin_apify:
  actor: curious_coder/linkedin-jobs-scraper
  # 4 runs per dag x 4 zoekopdrachten x 9 = ~4300 vacatures per maand (~$4,30, binnen het gratis tegoed van $5)
  every_hours: 6
  limit_per_search: 9
  # f_E=2 = entry level, f_TPR=r86400 = laatste 24 uur, geoId 102890719 = Nederland
  search_urls:
    - https://www.linkedin.com/jobs/search/?keywords=developer&location=Netherlands&geoId=102890719&f_E=2&f_TPR=r86400
    - https://www.linkedin.com/jobs/search/?keywords=software%20engineer&location=Netherlands&geoId=102890719&f_E=2&f_TPR=r86400
    - https://www.linkedin.com/jobs/search/?keywords=IT%20consultant&location=Netherlands&geoId=102890719&f_E=2&f_TPR=r86400
    - https://www.linkedin.com/jobs/search/?keywords=data%20OR%20AI%20OR%20cloud%20OR%20traineeship&location=Netherlands&geoId=102890719&f_E=2&f_TPR=r86400

# JSearch via RapidAPI (secret JSEARCH_KEY). Gratis = 200 requests per maand: elke 4 uur 1 zoekopdracht.
jsearch:
  every_hours: 4
  queries:
    - junior developer in Netherlands
    - junior software engineer in Netherlands
    - junior IT consultant in Netherlands
    - traineeship IT in Netherlands
    - junior data engineer in Netherlands
    - junior .NET OR Laravel developer in Netherlands

max_age_hours: 168       # alleen vacatures jonger dan dit (7 dagen)
history_days: 7          # zo lang blijven vacatures in jobs.json
requests_delay_s: 1.5    # pauze tussen requests per bron
max_jobs_ai_per_run: 120 # max nieuwe vacatures per uur naar Gemini (batches van 8, ~15 requests)
gemini_model: gemini-flash-lite-latest   # snel (~3 s per batch van 8); de gewone flash denkt 30+ s per vraag
min_score: 55            # onder deze score komt een vacature in "Lage match"
