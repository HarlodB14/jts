name: JTS vacatures ophalen

on:
  schedule:
    - cron: "7 * * * *"   # elk uur
  workflow_dispatch:
    inputs:
      alle_bronnen:
        description: "Ook LinkedIn (Apify) en JSearch nu draaien, buiten hun vaste uren (kost tegoed)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Vacatures ophalen
        run: python scraper/fetch_jobs.py
        env:
          JTS_FORCE_ALL: ${{ inputs.alle_bronnen }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          JSEARCH_KEY: ${{ secrets.JSEARCH_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          CAREERJET_AFFID: ${{ secrets.CAREERJET_AFFID }}
      - name: Matchen met cv
        working-directory: scraper
        run: python match.py
        env:
          CV_TEXT: ${{ secrets.CV_TEXT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit
        run: |
          git config user.name "jts-bot"
          git config user.email "jts-bot@users.noreply.github.com"
          git add docs/jobs.json scraper/
          git diff --cached --quiet || git commit -m "Vacatures bijgewerkt $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
